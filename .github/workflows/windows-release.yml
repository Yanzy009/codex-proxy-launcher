name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Generate application icon
        shell: powershell
        run: ./Windows/GenerateIcon.ps1 ./Windows/Assets/CodexProxy.ico
      - name: Run core tests
        run: dotnet run --project Windows/Tests/CodexProxyLauncher.Tests.csproj --configuration Release
      - name: Build launcher
        run: dotnet build Windows/CodexProxyLauncher.Windows.csproj --configuration Release
      - name: Build installer
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc Windows/Installer.iss
      - name: Create checksums
        shell: powershell
        run: |
          $installer = "dist/windows/Codex-Proxy-Launcher-Windows-x64-setup.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Codex-Proxy-Launcher-Windows-x64-setup.exe" | Set-Content "$installer.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Proxy-Launcher-Windows-x64
          path: |
            dist/windows/Codex-Proxy-Launcher-Windows-x64-setup.exe
            dist/windows/Codex-Proxy-Launcher-Windows-x64-setup.exe.sha256
            Docs/Windows使用流程图.svg
          if-no-files-found: error
      - name: Upload draft release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --draft --title "Codex Proxy Launcher ${GITHUB_REF_NAME}" --notes "Windows x64 安装包与使用流程图。发布前请核对自动测试与 SHA-256。"
          gh release upload "${GITHUB_REF_NAME}" \
            dist/windows/Codex-Proxy-Launcher-Windows-x64-setup.exe \
            dist/windows/Codex-Proxy-Launcher-Windows-x64-setup.exe.sha256 \
            Docs/Windows使用流程图.svg
